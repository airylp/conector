[package]
name = "conector"
version = "0.1.2"
edition = "2024"
license = "MIT"

[dependencies]
argon2 = "0.6.0"
base64 = "0.23.1"
chacha20poly1305 = "0.11.0"
eframe = { version = "0.37", features = ["glow"] }
# Fuentes de iconos/emojis incluidas (en egui 0.37 ya no van por defecto: sin ellas ⬇ ✔ ⚠ 🔒… salen como cuadros si el sistema no las tiene).
egui = { version = "0.37", default-features = false, features = ["monochrome_emoji_fonts"] }
getrandom = "0.4.3"
rcgen = { version = "0.14.10", default-features = false, features = ["ring", "pem", "crypto"] }
rfd = "0.17.2"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12", "logging"] }
sha2 = "0.11.1"

# Menú nativo de macOS (Acerca de, Ajustes, Salir…): ver src/macmenu.rs.
[target.'cfg(target_os = "macos")'.dependencies]
muda = { version = "0.21", default-features = false }

# Ícono y datos de versión del .exe (solo al compilar en Windows): ver build.rs.
[target.'cfg(windows)'.build-dependencies]
winresource = { version = "0.1", default-features = false }

[profile.release]
opt-level = 3
lto = "thin"
strip = true

[profile.dev.package."*"]
opt-level = 2
